aid: drone-racing-league
name: Drone Racing League
description: 'The Drone Racing League (DRL) is a New York-based professional drone racing
  property founded in 2015 by Nicholas Horbaczewski, staging first-person-view (FPV) races
  in which pilots fly identical, league-built quadcopters - the Racer series - through
  three-dimensional courses in stadiums, arenas and landmark venues at speeds above 80 mph.
  DRL designs its own racing drones, timing and telemetry hardware, produces and distributes
  its race broadcasts across NBC, Sky Sports, ProSiebenSat.1 and streaming platforms, and
  operates the DRL Simulator, an FPV racing game on Steam, PlayStation and Xbox that feeds
  the Swatch DRL Tryouts esports pipeline used to recruit professional pilots. The company
  was acquired by Infinite Reality (now Napster) in April 2024. DRL publishes no public
  developer portal, API documentation, SDKs or machine-readable API specification, and as
  of the 2026-08-04 enrichment pass its primary web properties (thedroneracingleague.com,
  drl.io) were not completing a TLS handshake.'
